name: hisabro
description: Complete Business Management Application - HisaBro
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # State Management
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5
  
  # Firebase
  firebase_core: ^2.24.2
  firebase_auth: ^4.15.3
  google_sign_in: ^6.1.6
  
  # Supabase
  supabase_flutter: ^2.3.4
  
  # Local Storage
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  shared_preferences: ^2.2.2
  
  # UI & Animations
  flutter_animate: ^4.5.0
  shimmer: ^3.0.0
  lottie: ^3.0.0
  flutter_svg: ^2.0.9
  google_fonts: ^6.1.0
  
  # Networking
  dio: ^5.4.0
  connectivity_plus: ^5.0.2
  
  # PDF & File
  pdf: ^3.10.7
  printing: ^5.11.1
  path_provider: ^2.1.1
  file_picker: ^6.1.1
  
  # Internationalization
  intl: ^0.19.0
  easy_localization: ^3.0.3
  
  # QR & Barcode
  qr_flutter: ^4.1.0
  mobile_scanner: ^3.5.5
  
  # Utilities
  uuid: ^4.3.3
  url_launcher: ^6.2.2
  share_plus: ^7.2.1
  permission_handler: ^11.1.0
  image_picker: ^1.0.5
  go_router: ^13.0.0
  
  # Date & Time
  syncfusion_flutter_datepicker: ^24.1.41
  
  # Charts
  fl_chart: ^0.66.0
  syncfusion_flutter_charts: ^24.1.41
  
  # Icons
  cupertino_icons: ^1.0.6
  flutter_iconpicker: ^3.2.4
  
  # Voice & AI
  speech_to_text: ^6.5.1
  flutter_tts: ^4.0.2
  
  # Encryption
  encrypt: ^5.0.3
  crypto: ^3.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1
  build_runner: ^2.4.7
  riverpod_generator: ^2.3.9
  hive_generator: ^2.0.1

flutter:
  uses-material-design: true
  
  assets:
    - assets/images/
    - assets/icons/
    - assets/translations/
  
  fonts:
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-Regular.ttf
        - asset: assets/fonts/Poppins-Medium.ttf
          weight: 500
        - asset: assets/fonts/Poppins-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Poppins-Bold.ttf
          weight: 700

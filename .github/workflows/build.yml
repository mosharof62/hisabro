name: Build HisaBro APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Java
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'
        
    - name: Setup Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.24.0'
        channel: 'stable'
        cache: true
        
    - name: Get dependencies
      run: flutter pub get
      
    - name: Run analyzer
      run: flutter analyze --no-fatal-warnings --no-fatal-infos
      
    - name: Create placeholder google-services.json
      run: |
        if [ ! -f "android/app/google-services.json" ]; then
          cat > android/app/google-services.json << 'EOF'
          {
            "project_info": {
              "project_number": "123456789",
              "project_id": "hisabro-placeholder"
            },
            "client": [{
              "client_info": {
                "mobilesdk_app_id": "1:123456789:android:abc",
                "android_client_info": {
                  "package_name": "com.hisabro.hisabx_app"
                }
              },
              "oauth_client": [],
              "services": {
                "analytics_service": {
                  "analytics_property": [{
                    "tracking_id": "UA-000000-1",
                    "certificates": []
                  }]
                }
              }
            }],
            "configuration_version": "3"
          }
          EOF
        fi

    - name: Build APK (Debug)
      run: flutter build apk --debug
      
    - name: Build APK (Release)
      run: flutter build apk --release
      
    - name: Upload Debug APK
      uses: actions/upload-artifact@v4
      with:
        name: hisabro-debug-apk
        path: build/app/outputs/flutter-apk/app-debug.apk
        
    - name: Upload Release APK
      uses: actions/upload-artifact@v4
      with:
        name: hisabro-release-apk
        path: build/app/outputs/flutter-apk/app-release.apk
